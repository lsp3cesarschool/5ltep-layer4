name: 5L-TEP Layer 4 Monitoring Workflow
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  CKAN_PORTAL_URL: https://dadosabertos.ibama.gov.br
  PYTHON_VERSION: '3.11'

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring cycle
        run: python main.py --portal ${{ env.CKAN_PORTAL_URL }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Commit provenance logs
        run: |
          git config user.name "5L-TEP L4 Bot"
          git config user.email "5ltep-l4-bot@users.noreply.github.com"
          git add provenance_logs/ data/
          git diff --cached --quiet || git commit -m "chore: update provenance logs [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
