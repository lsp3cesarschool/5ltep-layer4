name: 5L-TEP Layer 4 Monitoring Workflow
on:
  schedule:
    # Every 6 h, off the top of the hour (the busiest minute on GitHub's runners)
    # and away from the other 5L-TEP layers' schedules.
    - cron: '10 */6 * * *'
  workflow_dispatch:

# Portal: the repository variable CKAN_PORTAL_URL when set (Settings > Secrets and
# variables > Actions > Variables), otherwise portal.json (versioned).
env:
  CKAN_PORTAL_URL: ${{ vars.CKAN_PORTAL_URL }}
  PYTHON_VERSION: '3.11'

concurrency:
  group: layer4-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read      # failed runs and their logs, to record why a cycle failed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring cycle
        id: monitor
        run: python main.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}

      # Also after a failed cycle, to save why it failed; the run still fails (and e-mails).
      - name: Commit provenance logs, change log and dashboard data
        id: commit
        if: success() || failure()
        run: |
          git config user.name "5L-TEP L4 Bot"
          git config user.email "5ltep-l4-bot@users.noreply.github.com"
          git add provenance_logs/ data/ changes.md docs/data/
          git diff --cached --quiet || git commit -m "chore: update provenance logs [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Alert on CRITICAL schema change (SCHEMA_DRIFT / RETRO_ALTER)
        if: steps.monitor.outputs.critical == 'true'
        run: |
          echo "::error::CRITICAL change detected (${{ steps.monitor.outputs.critical_events }}): ${{ steps.monitor.outputs.critical_datasets }}"
          echo "Provenance records were committed before this alert. Affected logs:"
          IFS=',' read -ra FILES <<< "${{ steps.monitor.outputs.critical_dataset_files }}"
          for f in "${FILES[@]}"; do
            echo "  - https://github.com/${{ github.repository }}/blob/${{ steps.commit.outputs.sha }}/provenance_logs/$f"
          done
          exit 1
